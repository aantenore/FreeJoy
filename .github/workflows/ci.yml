name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install client
        run: npm ci
        working-directory: client
      - name: Build client
        run: npm run build
        working-directory: client
      - name: Audit client
        run: npm audit --audit-level=moderate
        working-directory: client
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Build server
        run: npm run build
        working-directory: server
      - name: Test server
        run: npm test
        working-directory: server
      - name: Smoke-test server package
        run: npm run package:smoke
        working-directory: server
      - name: Audit server
        run: npm audit --audit-level=moderate
        working-directory: server
